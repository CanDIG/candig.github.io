<head>
    <meta name="environment" content="{{ jekyll.environment }}">

    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}</title>
    <meta name="viewport" content="width=device-width">
    <meta name="description" content="{{ site.description }}">
    <link rel="canonical" href="{{ page.url | replace:'index.html','' | prepend: site.baseurl | prepend: site.url }}">

    <!-- Custom CSS & Bootstrap Core CSS - Uses Bootswatch Flatly Theme: http://bootswatch.com/flatly/ -->
    <link rel="stylesheet" href="{{ "/style.css" | prepend: site.baseurl }}">

    <!-- Custom Fonts -->
    <link rel="stylesheet" href="{{ "/css/font-awesome/css/font-awesome.min.css" | prepend: site.baseurl }}">
    <link href="https://fonts.googleapis.com/css?family=Montserrat:400,700" rel="stylesheet" type="text/css">
    <link href='https://fonts.googleapis.com/css?family=Kaushan+Script' rel='stylesheet' type='text/css'>
    <link href="https://fonts.googleapis.com/css?family=Lato:400,700,400italic,700italic" rel="stylesheet" type="text/css">
    <link href='https://fonts.googleapis.com/css?family=Droid+Serif:400,700,400italic,700italic' rel='stylesheet' type='text/css'>
    <link href='https://fonts.googleapis.com/css?family=Roboto+Slab:400,100,300,700' rel='stylesheet' type='text/css'>

    <!-- Twitter cards: thank you, https://brianbunke.com/blog/2017/09/06/twitter-cards-on-jekyll/ -->
    <meta name="twitter:creator" content="{{ page.author }}">
    {% if page.title %}
      <meta name="twitter:title"   content="{{ page.title }}">
    {% else %}
      <meta name="twitter:title"   content="{{ site.title }}">
    {% endif %} 
    <meta property="twitter:domain"   content="{{ site.url }}{{ site.baseurl }}">
  
    {% if page.summary %}
      <meta name="twitter:description" content="{{ page.summary }}">
    {% else %}
      <meta name="twitter:description" content="{{ site.description }}">
    {% endif %}

    {% if page.image %}
      <meta name="twitter:card"  content="summary_large_image">
      <meta name="twitter:image" content="{{ site.url }}{{ site.baseurl }}/{{ page.image }}">
    {% else %}
      <meta name="twitter:card"  content="summary">
      <meta name="twitter:image" content="{{ site.url }}{{ site.baseurl }}/img/logo_only.png">
    {% endif %}

</head>
