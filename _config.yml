url: https://candig.github.io

# Site settings
title: CanDIG
contact_email:  # split to deter scrapers; rendered by _includes/email.html
  user: karen.cranston
  domain: uhn.ca
description: "CanDIG enables national-scale analysis of locally-controlled private genomic data"

collections:
  posts:
      output: true
      permalink: /posts/:title/index.html
  releases:
      output: true
      permalink: /releases/:title/index.html

# Social networks usernames (many more available: google-plus, flickr, dribbble, pinterest, instagram, tumblr, linkedin, etc.)
social:
  - title: github
    url: http://github.com/candig

# Build settings
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

# Plugins
plugins:
- jekyll-feed

include: [ "_pages" ]

encoding: utf-8
